# WARMFUL — CI: DSP tests on Linux; Windows build, tests, installer, silent install + pluginval.
# Tags v* publish the Windows installer as a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-dsp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP core and test-suite
        run: |
          cmake -S . -B build-tools -DWARMFUL_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tools -j 4
      - name: Behavioural checks
        run: ./build-tools/warmful_render test

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3, Standalone and test-suite
        run: cmake --build build --config Release --parallel --target WARMFUL_VST3 WARMFUL_Standalone warmful_render

      - name: Behavioural checks
        run: build\Release\warmful_render.exe test

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project \(WARMFUL VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$version" installer\windows\WARMFUL.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\installer

      - name: Silent install, validate the installed VST3, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build\installer\*.exe | Select-Object -First 1).FullName
          $vst3Dir = Join-Path $env:RUNNER_TEMP "vst3"
          $appDir = Join-Path $env:RUNNER_TEMP "WARMFUL"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/COMPONENTS=vst3,standalone,docs', "/DIR=$appDir", "/VST3DIR=$vst3Dir", "/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; exit $p.ExitCode }
          foreach ($f in @("$vst3Dir\WARMFUL.vst3\Contents\x86_64-win\WARMFUL.vst3", "$appDir\WARMFUL.exe", "$appDir\LICENSE.txt")) {
            if (-not (Test-Path $f)) { Write-Error "missing after install: $f"; exit 1 }
          }
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --validate "$vst3Dir\WARMFUL.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $u = Start-Process "$appDir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$vst3Dir\WARMFUL.vst3") { Write-Error "uninstaller left the VST3 behind"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: WARMFUL-Windows-Setup
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-ChildItem build\installer\*.exe | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $setup --title "WARMFUL $env:GITHUB_REF_NAME" --notes "Windows 10/11 x64 installer: VST3 plug-in + standalone app. Choose components, the app folder and the VST3 folder during setup. The installer is not code-signed, so SmartScreen may ask for confirmation (More info > Run anyway)."
